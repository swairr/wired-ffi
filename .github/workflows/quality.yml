name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.13
    
    - name: Install dependencies
      run: uv sync --dev
    
    - name: Install additional tools
      run: |
        uv add --dev ruff bandit safety vulture radon
    
    - name: Code formatting check
      run: uv run black --check --diff .
    
    - name: Import sorting check
      run: |
        uv add --dev isort
        uv run isort --check-only --diff .
    
    - name: Linting with ruff
      run: uv run ruff check . --output-format=github
    
    - name: Type checking
      run: |
        echo "Running mypy type checking..."
        uv run mypy wired_ffi --show-error-codes
        echo "Running pyright type checking..."
        uv run pyright wired_ffi
    
    - name: Security analysis with bandit
      run: uv run bandit -r wired_ffi/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Dependency vulnerability check
      run: uv run safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Dead code detection
      run: uv run vulture wired_ffi/ --min-confidence 80
      continue-on-error: true
    
    - name: Code complexity analysis
      run: |
        uv run radon cc wired_ffi/ -a -nc
        uv run radon mi wired_ffi/ -nc
      continue-on-error: true
    
    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.13
    
    - name: Install dependencies
      run: uv sync --dev
    
    - name: Install coverage tools
      run: uv add --dev pytest-cov coverage
    
    - name: Run tests with coverage
      run: |
        uv run pytest --cov=wired_ffi --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.13
    
    - name: Install dependencies
      run: uv sync --dev
    
    - name: Install performance testing tools
      run: uv add --dev pytest-benchmark
    
    - name: Run performance tests
      run: |
        # Create performance test data
        python -c "
import json
import time
from wired_ffi.core import FFISerializer

# Test serialization performance
test_data = {'key': 'value' * 1000, 'numbers': list(range(1000))}

for format_type in ['json', 'pickle']:
    serializer = FFISerializer(format_type)
    
    # Warmup
    for _ in range(10):
        serializer.serialize(test_data, f'perf_test_{format_type}.tmp')
    
    # Benchmark
    start_time = time.time()
    for _ in range(100):
        serializer.serialize(test_data, f'perf_test_{format_type}.tmp')
    end_time = time.time()
    
    print(f'{format_type} serialization: {(end_time - start_time) * 1000:.2f}ms for 100 iterations')
"
    
    - name: Benchmark CLI performance
      run: |
        # Create test file
        echo '{"benchmark": "data", "items": [1,2,3,4,5]}' > bench_input.json
        
        # Benchmark CLI commands
        time uv run wired-ffi serialize --format json bench_input.json bench_output.json
        time uv run wired-ffi deserialize --format json bench_output.json bench_restored.json
        time uv run wired-ffi call bench_input.json bench_response.json